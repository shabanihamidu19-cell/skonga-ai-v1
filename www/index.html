<!-- ══ FIREBASE AUTH SDK ══════════════════════════════════════════
     Loaded as ES module from CDN. Exposes window._fb bridge so
     the non-module main script can use Firebase normally.
     Graceful fallback: if CDN load fails (preview/offline), the
     app still renders — auth features just show friendly message.
════════════════════════════════════════════════════════════════[...]
<script type="module">
/* Firebase is loaded from CDN — this WILL fail when the device is offline.
   The entire block is wrapped in try-catch so a network failure here does
   NOT prevent the rest of the app from working. When offline:
   - window._fb.ready stays false
   - Auth features show a friendly "no internet" message
   - Everything else (chat history, notes, offline queue) still works */
try {
const CDN = 'https://www.gstatic.com/firebasejs/12.16.0';
const [
  { initializeApp },
  { getAuth, onAuthStateChanged, signInWithEmailAndPassword,
    createUserWithEmailAndPassword, signOut, updateProfile,
    GoogleAuthProvider, signInWithPopup, signInWithRedirect,
    getRedirectResult }
] = await Promise.all([
  import(`${CDN}/firebase-app.js`),
  import(`${CDN}/firebase-auth.js`)
]);

const app  = initializeApp({
  apiKey:            "AIzaSyBEUstmycExFobMi4abvxluyGMNRGDyabs",
  authDomain:        "skonga-ai-ddfc9.firebaseapp.com",
  projectId:         "skonga-ai-ddfc9",
  storageBucket:     "skonga-ai-ddfc9.firebasestorage.app",
  messagingSenderId: "907249107855",
  appId:             "1:907249107855:web:963c877cc22d6af1a441fa"
});
const auth      = getAuth(app);
const gProvider = new GoogleAuthProvider();
gProvider.addScope('profile');
gProvider.addScope('email');

const FB_ERRORS = {
  'auth/invalid-email':           'Invalid email address.',
  'auth/user-not-found':          'Account not found. Please register first.',
  'auth/wrong-password':          'Incorrect password.',
  'auth/invalid-credential':      'Invalid email or password.',
  'auth/email-already-in-use':    'This email already has an account.',
  'auth/weak-password':           'Password must be at least 6 characters.',
  'auth/network-request-failed':  'No network connection. Check your internet.',
  'auth/too-many-requests':       'Too many attempts. Please try again later.',
  'auth/popup-closed-by-user':    'Google sign-in window was closed.',
  'auth/cancelled-popup-request': 'Please wait a moment and try again.',
};
const fbErr = code => FB_ERRORS[code] || 'An error occurred. Please try again.';

/* ── window._fb bridge ─────────────────────────────────────────
   Main script accesses Firebase ONLY through this object.
   Separation is required because ES module scripts have their
   own scope — variables are NOT global by default.
────────────────────────────────────────────────────────────────[...]
window._fb = {
  ready: true,
  currentUser: null,
  idToken:     null,
  err:         fbErr,

  async signIn(email, pass){
    return signInWithEmailAndPassword(auth, email, pass);
  },
  async signUp(name, email, pass){
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    return cred;
  },
  async signInGoogle(){
    if(window.Capacitor?.isNativePlatform?.())
      return signInWithRedirect(auth, gProvider);
    return signInWithPopup(auth, gProvider);
  },
  async logout(){ return signOut(auth); },
  async refreshToken(){
    if(!auth.currentUser) return null;
    return auth.currentUser.getIdToken(true);
  }
};

/* ── Auth state listener ─────────────────────────────────────── */
onAuthStateChanged(auth, async user => {
  window._fb.currentUser = user;
  window._fb.idToken     = user ? await user.getIdToken() : null;
  if(user){
    if(!window._fb._refreshTimer){
      window._fb._refreshTimer = setInterval(async () => {
        try{
          window._fb.idToken = await window._fb.refreshToken();
        }catch(e){
          console.warn('[Firebase] Token refresh failed — user may need to sign in again:', e.message||e);
          window._fb.idToken = null;
        }
      }, 55 * 60 * 1000);
    }
  } else {
    clearInterval(window._fb._refreshTimer);
    window._fb._refreshTimer = null;
  }
  window.dispatchEvent(new CustomEvent('fbAuthChanged', { detail: user }));
});

getRedirectResult(auth).catch(()=>{});

} catch(fbInitErr) {
  /* Firebase SDK failed to load (most likely: no internet connection).
     Set up a minimal stub so auth calls fail gracefully with a clear
     message instead of throwing "Cannot read properties of undefined". */
  console.warn('[Firebase] SDK failed to load (offline?):', fbInitErr.message || fbInitErr);
  window._fb = {
    ready: false,
    currentUser: null,
    idToken: null,
    err: () => 'No internet connection. Please connect and try again.',
    async signIn(){ throw { code:'auth/network-request-failed' }; },
    async signUp(){ throw { code:'auth/network-request-failed' }; },
    async signInGoogle(){ throw { code:'auth/network-request-failed' }; },
    async logout(){ return; },
    async refreshToken(){ return null; }
  };
  /* Fire auth-changed with null so the app knows there is no signed-in user */
  window.dispatchEvent(new CustomEvent('fbAuthChanged', { detail: null }));
}
</script>

<script>
(function(){
  // Greeting: picks a random greeting and shows "<greeting>, <name> 👋"
  function setGreeting(){
    try{
      const el = document.getElementById('greeting');
      if(!el) return;
      const name = localStorage.getItem('skongaUserName') || (window.currentUser && window.currentUser.name) || 'Friend';
      const greetings = ['What is New','Welcome back','Good to see you','Ready to explore'];
      const g = greetings[Math.floor(Math.random()*greetings.length)];
      el.textContent = `${g}, ${name} 👋`;
    }catch(e){ console.error(e); }
  }

  // Theme: apply theme to document using appSettings.theme or localStorage fallback
  function applyTheme(){
    try{
      const stored = (window.appSettings && appSettings.theme) || localStorage.getItem('skongaTheme') || 'dark';
      let t = stored;
      if(t === 'auto'){
        const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        t = prefersLight ? 'light' : 'dark';
        if(window.matchMedia && !window._systemThemeWired){
          window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{
            if((window.appSettings && appSettings.theme==='auto') || localStorage.getItem('skongaTheme')==='auto') applyTheme();
          });
          window._systemThemeWired = true;
        }
      }
      if(t === 'light') document.documentElement.setAttribute('data-theme','light');
      else document.documentElement.removeAttribute('data-theme');
    }catch(e){ console.error(e); }
  }
  window.applyTheme = applyTheme;

  // Theme segmented control handler
  window.setThemeSeg = function(btn){
    try{
      document.querySelectorAll('#themeSeg .seg-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const val = btn.dataset.val;
      if(window.appSettings){
        appSettings.theme = val;
        if(typeof persistSettings === 'function') persistSettings();
      } else {
        localStorage.setItem('skongaTheme', val);
      }
      applyTheme();
    }catch(e){ console.error(e); }
  };

  // Ensure Upgrade buttons actually open pay.html (works in browser & Capacitor)
  window.openSkongaPay = function(){
    try{
      if(window.Capacitor?.Plugins?.Browser && typeof window.Capacitor.Plugins.Browser.open === 'function'){
        window.Capacitor.Plugins.Browser.open({ url: './pay.html' });
      } else {
        window.location.href = './pay.html';
      }
    }catch(e){
      window.location.href = './pay.html';
    }
  };

  // Robust profile opener (fixes profile sheet not opening in some cases)
  function safeOpenProfile(e){
    try{ if(e) e.preventDefault(); }catch(_) {}
    try{ if(typeof closeSidebar === 'function') closeSidebar(); }catch(_) {}
    try{
      if(typeof updateProfileView === 'function') updateProfileView();
      const sheet = document.getElementById('profileSheet');
      if(sheet) sheet.classList.remove('hidden');
    }catch(err){
      console.error('safeOpenProfile', err);
    }
  }
  ['profileBtn','sidebarProfileBtn','headerAvatar'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('click', safeOpenProfile);
  });
  // Ensure profile sheet closes when clicking overlay or close button
  const profileSheet = document.getElementById('profileSheet');
  if(profileSheet){
    profileSheet.addEventListener('click', e => { if(e.target === profileSheet) profileSheet.classList.add('hidden'); });
    const pc = document.getElementById('profileClose');
    if(pc) pc.addEventListener('click', ()=> profileSheet.classList.add('hidden'));
  }

  // Initialize on DOM ready
  document.addEventListener('DOMContentLoaded', function(){
    setGreeting();
    // apply theme on load
    applyTheme();
    // reflect stored theme in UI segmented control
    const cur = (window.appSettings && appSettings.theme) || localStorage.getItem('skongaTheme') || 'auto';
    const btn = document.querySelector(`#themeSeg .seg-btn[data-val="${cur}"]`) || document.querySelector(`#themeSeg .seg-btn[data-val="auto"]`);
    if(btn) btn.classList.add('active');
  });

})();
</script>
